[workspace]
resolver = "2"
members = ["crates/core", "crates/host", "crates/gui", "crates/platform", "crates/platform-windows"]

[workspace.package]
version = "1.8.0"
edition = "2021"
license = "MIT"
authors = ["FullScene Team"]

[workspace.dependencies]
# ---- 软件主体 GUI（Tauri 2 模式：tao 窗口 + wry/WebView2 渲染）----
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ---- 核心业务 ----
# OCR：PP-OCRv6 走 oar-ocr（内部绑定 ort），替代直接依赖 ort。
# 理由：旧项目已用 oar-ocr 0.9 跑通真实模型推理；裸 ort 需自行实现 det/rec 前后处理。
oar-ocr = "0.9"
# ort 直接依赖，仅为开启 load-dynamic（不引入任何 API 使用）。
# 起因：ct2rs 的 sentencepiece-sys 与 ort-sys 各自静态编译了一份 protobuf，
# 链接期符号重复（LNK2005 google::protobuf::internal::* + LNK1169）。
# ort 的 default features 含 download-binaries（静态链接 onnxruntime.dll → 拖入 protobuf），
# 不含 load-dynamic。开 load-dynamic 后 ort 改为运行时动态加载 onnxruntime.dll，
# 不再把 protobuf 静态链进二进制，从根上消除符号冲突。
# 注意：需保证运行目录下存在 onnxruntime.dll（models/ 或 exe 同级）。
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "download-binaries", "copy-dylibs"] }
image = "0.25"
# HTTP：本地 LLM（Ollama / LM Studio）为 http 明文；云翻译引擎需 https，故开 tls
# （Windows 上 native-tls 走 schannel，无需 openssl/外部库）
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
# 配置 / 数据目录解析（%APPDATA% / ~/Library / ~/.config）
dirs = "5"
# 历史库
rusqlite = { version = "0.31", features = ["bundled"] }

# ---- 离线翻译（Argos 语言包，纯 Rust 绑定 CTranslate2）----
# ct2rs 构建期需要 CMake ≥ 3.16（编译 CTranslate2 C++），运行期零 Python 依赖。
# sentencepiece 特性提供 ct2rs::tokenizers::sentencepiece::Tokenizer 封装。
#
# 2026-10-05：改回 crates.io 正式版，弃用本地镜像 D:\g\ct2rs-clean。
# 起因：该镜像的 include/ 与 third_party/spdlog/include/spdlog/ 被大面积清空
# （目录时间戳 15:47/ 20:46，src 等其他目录仍是14:01，明显非本次改动），
# 导致 cc-rs 报 `C1083: 无法打开包括文件 "ct2rs/include/config.h"`，
# fs-core/fs-gui 全部门禁无法编译。已核实 **crates.io 0.10.1 官方包内容完整**
# （include/ 7 个头文件 + third_party/spdlog 20 个文件含 version.h），
# 故正式版可完全替代镜像，且消除「本机绝对路径依赖」这一结构性缺陷
# （镜像方案换机/换人/CI 全部编译不过）。
ct2rs = { version = "0.10.1", features = ["sentencepiece"] }

# ---- 错误处理 ----
thiserror = "1"
anyhow = "1"

# ---- 平台能力：截图（GDI）、全局热键（RegisterHotKey）、托盘（Shell_NotifyIcon）----
[workspace.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    # 十字框选需要 Per-Monitor DPI 感知：否则多显示器/缩放屏下鼠标坐标与窗口像素错位
    "Win32_UI_HiDpi",
    # ---- 划词取词（ADR-006）----
    # IUIAutomation / IUIAutomationTextPattern：主路径读应用内划选文本
    "Win32_UI_Accessibility",
    # CoInitializeEx / CoCreateInstance：UIA 与 SAPI5 均为 COM 对象，必须先初始化 COM 单元
    "Win32_System_Com",
    # OpenClipboard / GetClipboardData / GetClipboardSequenceNumber：UIA 失败时的兜底路径
    "Win32_System_DataExchange",
    # GlobalLock / GlobalSize：把 GetClipboardData 返回的 HGLOBAL 锁成 UTF-16 字符串
    "Win32_System_Memory",
    # CF_UNICODETEXT 常量定义在 System::Ole 而非 DataExchange（易踩坑）
    "Win32_System_Ole",
]
